[project]
name = "condor-expeditions-backend"
version = "0.1.0"
description = "Backend API for Condor Expeditions tourism platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "django-ninja>=1.1.0",
    "djangorestframework>=3.14.0",
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.6.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "python-decouple>=3.8",
    "pillow>=10.0.0",
    "django-cors-headers>=4.3.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "stripe>=7.0.0",
    "boto3>=1.34.0",
    "drf-yasg>=1.21.0",
    "django-filter>=23.0",
    "django-storages>=1.14.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "weasyprint>=60.0",
    "sentry-sdk>=1.40.0",
]

[dependency-groups]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-django>=4.5.0",
    "factory-boy>=3.3.0",
    "coverage>=7.3.0",
]
